name: Deploy to Gitee Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy-gitee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install and build for Gitee (/wjhaaa.github.io subpath)
        env:
          NEXT_PUBLIC_BASE_PATH: /wjhaaa.github.io
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Push static site to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          cd out
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "deploy: ${GITHUB_SHA:0:7}"
          git push -f "https://workhrad:${GITEE_TOKEN}@gitee.com/workhrad/wjhaaa.github.io.git" main
